        .background {

            background:

                linear-gradient(135deg, #111, #050505, #190606);
            position: relative;
            overflow: hidden;
        }

        /* HIỆU ỨNG VỆT ĐỎ */
        .background::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                125deg,
                transparent 0px,
                transparent 120px,
                rgba(220, 0, 0, 0.08) 122px,
                transparent 130px
            );
            pointer-events: none;
        }

        /* PHẦN ĐẦU */
        header {
            position: relative;
            text-align: center;
            padding: 25px 10px 20px;
            border-bottom: 2px solid #e00000;
            background: rgba(0, 0, 0, 0.65);
        }

        header h1 {
            font-size: clamp(30px, 5vw, 55px);
            font-weight: 900;
            font-style: italic;
            letter-spacing: 3px;
            text-shadow: 3px 3px 0 #850000;

        }

        .video-container::before {
            content: "▶ LIVE VIDEO";
